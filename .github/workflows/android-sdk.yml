name: Android SDK Images
on: workflow_dispatch

env:
  # Look for NDK versions here:
  #  https://developer.android.com/ndk/downloads
  NDK: 26.2.11394342
  # Images path and name
  IMAGE_NAME: android-sdk
  IMAGE_PATH: ghcr.io/redmadrobot/android/android-sdk

jobs:
  # Dirty hack to make env variables visible inside 'with'
  # See https://github.com/orgs/community/discussions/26671
  env:
    name: Prepare environment variables
    runs-on: ubuntu-latest
    outputs:
      ndk: ${{ steps.env.outputs.ndk }}
      image-name: ${{ steps.env.outputs.image-name }}
      image-path: ${{ steps.env.outputs.image-path }}
    steps:
      - name: Save env variables to outputs
        id: env
        run: |
          echo "ndk=$NDK" >> $GITHUB_OUTPUT
          echo "image-name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "image-path=$IMAGE_PATH" >> $GITHUB_OUTPUT

  android-sdk-base:
    name: Publish Android SDK base image
    needs: env
    uses: ./.github/workflows/publish-image.yml
    with:
      image-name: ${{ needs.env.outputs.image-name }}
      target: base
      platforms: linux/amd64,linux/arm64
      title: Android SDK base image
      tags: |
        base
        base-{{date 'YYYYMMDD'}}

  android-sdk:
    name: Publish Android SDK image
    needs: [ android-sdk-base, env ]
    strategy:
      matrix:
        sdk: [ 32, 33, 34 ]
    uses: ./.github/workflows/publish-image.yml
    with:
      image-name: ${{ needs.env.outputs.image-name }}
      target: sdk
      platforms: linux/amd64,linux/arm64
      title: Android SDK ${{ matrix.sdk }} image
      tags: |
        ${{ matrix.sdk }}
        ${{ matrix.sdk }}-{{date 'YYYYMMDD'}}
      build-contexts: |
        base=docker-image://${{ needs.env.outputs.image-path }}:base
      build-args: |
        sdk=${{ matrix.sdk }}

  android-sdk-ndk:
    name: Publish Android SDK image with NDK
    needs: [ android-sdk, env ]
    strategy:
      matrix:
        sdk: [ 32, 33, 34 ]
    uses: ./.github/workflows/publish-image.yml
    with:
      image-name: ${{ needs.env.outputs.image-name }}
      target: ndk
      platforms: linux/amd64,linux/arm64
      title: Android SDK ${{ matrix.sdk }} image with NDK ${{ needs.env.outputs.ndk }}
      tags: |
        ${{ matrix.sdk }}-ndk
        ${{ matrix.sdk }}-ndk-${{ needs.env.outputs.ndk }}
        ${{ matrix.sdk }}-ndk-${{ needs.env.outputs.ndk }}-{{date 'YYYYMMDD'}}
      build-contexts: |
        sdk=docker-image://${{ needs.env.outputs.image-path }}:${{ matrix.sdk }}
      build-args: |
        ndk=${{ needs.env.outputs.ndk }}

  # Android SDK 36 pipeline.
  # Android Gradle Plugin requires build-tools 36.0.0+ for compileSdk 36, so this pipeline
  # builds its own base image variant with build-tools 36.0.0 instead of the default 34.0.0.
  # Images published by the jobs above keep build-tools 34.0.0 and are not affected.
  android-sdk-base-36:
    name: Publish Android SDK base image with build-tools 36.0.0
    needs: env
    uses: ./.github/workflows/publish-image.yml
    with:
      image-name: ${{ needs.env.outputs.image-name }}
      target: base
      platforms: linux/amd64,linux/arm64
      title: Android SDK base image with build-tools 36.0.0
      tags: |
        base-36.0.0
        base-36.0.0-{{date 'YYYYMMDD'}}
      build-args: |
        build_tools=36.0.0

  android-sdk-36:
    name: Publish Android SDK 36 image
    needs: [ android-sdk-base-36, env ]
    uses: ./.github/workflows/publish-image.yml
    with:
      image-name: ${{ needs.env.outputs.image-name }}
      target: sdk
      platforms: linux/amd64,linux/arm64
      title: Android SDK 36 image
      tags: |
        36
        36-{{date 'YYYYMMDD'}}
      build-contexts: |
        base=docker-image://${{ needs.env.outputs.image-path }}:base-36.0.0
      build-args: |
        sdk=36
